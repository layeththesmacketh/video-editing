[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lattimore"
version = "0.1.0"
description = "Editorial taste + multi-track timeline composition for Lattimore's interview-led video work."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nick Lattimore" }]
dependencies = [
    "opentimelineio>=0.17",
    "opentimelineio-plugins>=0.17",
    "otio-fcpx-xml-lite-adapter>=0.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
ingest = [
    # Heavy. Install only when you need to transcribe + vision-analyze locally.
    "whisperx>=3.1",
    "anthropic>=0.40",
]

[tool.setuptools.packages.find]
where = ["lib"]
include = ["lattimore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lib"]
